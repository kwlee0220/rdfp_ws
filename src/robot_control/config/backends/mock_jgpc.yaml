# mock 스택의 JGPC 변형 — panda_jgpc_mock.launch.py.
#
# **컨트롤러 이름은 그대로 `panda_arm_controller` 인데 종류만 바뀐다**
# (`position_controllers/JointGroupPositionController`). 명령에 관절 이름이 없어
# **배열 순서가 계약**이며, 실행은 스트리밍이라 **개루프다**.
name: mock_jgpc
description: ros2_control mock_components + JointGroupPositionController (개루프)

# MoveGroup 클라이언트가 팔에 명령을 보내는 채널.
arm_command:
  mode: jgpc

ros2_control:
  hardware_type: mock_components
  # 컨트롤러 종류만 바꾼 복사본. `joints` 순서가 곧 명령 배열의 계약이다.
  controllers_file: config/panda_jgpc_ros2_controllers.yaml

servo:
  linear_scale: null
  # 이 스택에서는 servo 출력도 Float64MultiArray 다 — `publish_joint_velocities: false`
  # 가 **필수**이며, 안 그러면 servo 의 파라미터 검증이 실패해 노드가 아예 안 뜬다.
  command_out_type: std_msgs/Float64MultiArray
  # JGPC 컨트롤러의 명령 토픽. 이름 없는 배열이라 순서가 계약이다.
  command_out_topic: /panda_arm_controller/commands

camera:
  # 시뮬레이터가 이미지를 안 주므로 OpenCV `camera_node` 가 장치/파일에서 캡처한다.
  source: device
  image_topic: /camera/image_raw

scene:
  file: null

# 녹화 토픽 목록(`config/recording_topics*.list`)은 **여기 못 넣는다** — 워크스페이스
# 루트에 있고 `record_rosbag.sh` 가 `RECORDING_TOPICS_FILE` 로, `dataset_config.yaml` 이
# `topics_file` 로 읽는다. 패키지 자산이 아니라 설치본(`share/`)에서 해석할 수 없다.
# 옮기려면 파일 위치와 그 두 소비자를 함께 고쳐야 한다 — 별건이다.

use_sim_time: false

# 팔 끝 프레임. **`ee` 를 적지 않는 것이 의도다.**
#
# 이 스택의 `/ee_pose` 는 `panda_hand` 를 가리키지만 `panda_link8` 과 **평행이동이
# 0 이고 z 축 −45° 회전만 다르다** (`panda_links.urdf.xacro` 의 `panda_hand_joint`).
# 위치가 같으므로 펑션베이의 `grasp_center` 같은 149 mm 어긋남이 없고, 45° 는
# **MCP 클라이언트가 이미 `to_arm_command()` 에서 곱하고 있다** — 여기에 `ee` 를
# 적으면 트윈이 한 번 더 돌려 **90° 이중 회전**이 되어 손가락이 엉뚱한 축으로 물린다.
#
# ⚠️ 그 보정을 클라이언트에서 트윈으로 옮기는 것은 **계획서 5단계**의 일이다.
# 옮길 때 이 주석과 함께 `ee: panda_hand` 를 넣는다.
frames:
  tip: panda_link8

# rosbag CLI 설정 샘플.
#
# **주의 — 현재 CLI 는 이 파일을 읽지 않는다.** 구현된 서브커맨드는 `list-topics`
# 와 `clear` 둘뿐이고, 경로는 `--config` 가 아니라 `--rosbag-dir`(또는 환경변수
# RDFP_ROSBAG_DIR)로 준다. `list-episodes` / `topic-info` / `--config` 는 아직 없다.
#
#   ros2 run rdfp rosbag list-topics --rosbag-dir /data/rosbag
#   ros2 run rdfp rosbag clear       --rosbag-dir /data/rosbag --yes
#
# 아래 키들은 설계상 남겨 둔 것이며, 에피소드 조회가 필요하면 지금은 적재 코드를
# 직접 부른다.
#
#   from rdfp.rosbag.catalog import discover_splits
#   from rdfp.dataset.ingest.pipeline import _detect_all_episodes
#   eps = _detect_all_episodes(discover_splits('/data/rosbag'))
#
# rosbag CLI 는 rosbag 을 읽기 전용으로 조회하므로 DB 접속 정보(db 섹션)
# 와 MP4 출력 경로(output_mp4_dir) 는 필요하지 않다.


# ── 입력 경로 ─────────────────────────────────────────────────────
rosbag_dir: /data/rosbag


# ── 대상 토픽 화이트리스트 (비우면 rosbag 의 모든 토픽) ────────────
#   /session 은 자동 포함되므로 누락해도 무방하다.
#   list-episodes 의 split 후보 필터에만 사용되며, list-topics /
#   topic-info 는 rosbag 의 모든 토픽을 대상으로 한다.
topics: []


# ── 에피소드 필터 (list-episodes 전용) ─────────────────────────────
episode_filter:
  task_labels_include: []
  task_labels_exclude: []
  min_duration_sec: 0.0


# ── 세션 사전 필터 ─────────────────────────────────────────────────
session_filter:
  dates: []


# ── 운영 통합 (선택) ──────────────────────────────────────────────
catalog_index_path: null            # 예: /data/rosbag/_index.sqlite

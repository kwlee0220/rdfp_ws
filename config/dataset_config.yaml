# 적재 설정 — init-db · import · stats · list · replay 와 rosbag CLI(`--config`)가 함께 읽는다.
#
# 실행 전 DSN 환경변수를 설정한다 (`.rdfprc` 가 export 한다):
#   export RDFP_DB_DSN="postgresql://rdfp@localhost:5432/rdfp"
#
# 실행 (워크스페이스 루트에서 — `--config` 를 안 주면 `$RDFP_HOME/config/dataset_config.yaml` 을 찾는다):
#   ros2 run rdfp init-db
#   ros2 run rdfp import --config config/dataset_config.yaml
#   ros2 run rdfp stats  --config config/dataset_config.yaml
#
# ⚠️ 이 파일을 다른 디렉터리로 복사하면 아래 `topics_file` 상대 경로가 깨진다 — 절대 경로로 바꾼다.
# ⚠️ 모르는 키는 오류 없이 무시된다 — 오타를 내면 기본값으로 돈다.
#
# 운영 가이드: docs/collect/데이터셋_적재_운영_가이드.md · 필드 근거: docs/collect/데이터셋_적재_시스템_설계서.md 4장.


# ── 입출력 경로 ─────────────────────────────────────────────────────
#   `${VAR}` / `${VAR:-default}` 환경변수 치환과 `~` 홈 확장을 지원한다 (경로 필드 한정).
rosbag_dir:     ${RDFP_ROSBAG_DIR:-$HOME/rosbag}  # rosbag2 MCAP 루트 (운영 방안 4장 구조)
output_mp4_dir: ${RDFP_VIDEOS_DIR:-/data/rdfp/videos}  # bag 이미지를 인코딩한 mp4(episode_<id>/) · 실행 로그(_logs/) 자리 (import 필수)
# **레코더가 남긴 mp4 의 루트** (`image_pipeline.yaml` 의 `output_dir` 과 같은 값).
# 주면 적재가 그 출력을 읽어 `image_streams`·`image_frames` 에 등록한다 —
# `episode_key`(레코더 metadata) 로 에피소드를 찾으며 **파일 이름으로 맞추지 않는다**.
# ⚠️ 위 `output_mp4_dir` 과 **다른 것이다**: 그쪽은 적재가 rosbag 이미지를 직접
# 인코딩해 만드는 경로이고, 영상을 rosbag 에 담지 않는 방향에서는 이쪽이 정본이다.
# 비워 두면 등록하지 않는다 (영상 없이 수집한 데이터도 유효하다).
recordings_dir: ${RDFP_RECORDINGS_DIR:-/data/rdfp/recordings}


# ── DB 접속 (DSN 은 환경변수로 주입) ───────────────────────────────
db:
  dsn_env: RDFP_DB_DSN
  schema: public


# ── 대상 토픽 화이트리스트 (비우면 rosbag 의 모든 토픽) ────────────
#   /session 은 자동 포함되므로 누락해도 무방하다.
#   topics_file 은 record_rosbag.sh 와 공유하는 텍스트 파일이다. 상대 경로는
#   이 YAML 의 디렉터리 기준으로 해석한다.
#   ⚠️ 아래 topics: 는 topics_file 에 **더해진다**(합집합, 중복 제거) — 좁히지 않는다.
#   좁히려면 목록 파일을 따로 만들어 가리키거나, topics_file 을 빼고 topics 만 적는다.
topics_file: recording_topics.list
# topics: []


# ── 에피소드 필터 ──────────────────────────────────────────────────
episode_filter:
  task_labels_include: []          # 포함할 task_label 목록 (빈 목록 = 제한 없음)
  task_labels_exclude: []          # 제외할 task_label 목록
  min_duration_sec: 0.0            # 이 시간보다 짧은 에피소드는 건너뜀


# ── 세션 사전 필터 ─────────────────────────────────────────────────
session_filter:
  dates: []                        # ["YYYY-MM-DD", ...] — 따옴표 필수 (없으면 YAML 이 날짜로 읽어 검증 실패)


# ── 중복 에피소드 처리 정책 ────────────────────────────────────────
#   skip     : 이미 존재하는 에피소드는 건너뜀 (기본)
#   replace  : 기존 DB 행 + mp4 디렉터리를 삭제하고 재적재
#   error    : 중복 발견 시 즉시 실패
on_existing_episode: skip


# ── MP4 인코딩 ─────────────────────────────────────────────────────
mp4:
  codec: h264                       # h264 / (향후 확장)
  nominal_fps: 30                   # CFR 로 선언할 프레임 레이트


# ── 운영 통합 (선택) ──────────────────────────────────────────────
#   1 = 단일 프로세스(첫 실패에서 멈춘다). 2 이상이면 에피소드 단위 병렬 처리
#   (실패해도 끝까지 돌고, 요약의 failed 에 센 뒤 종료 코드 1).
parallelism: 1

# rosbag 을 임시 스테이징으로 운용할 때: import 후 이번에 찾은 split(.mcap)을
# 지우고, metadata.yaml 만 남은 세션 디렉터리도 정리한다.
# ⚠️ 지우는 단위는 에피소드가 아니라 split 파일이다. 그래서 실패한 에피소드가
# 있거나 필터(task_labels · min_duration · rosbag export 의 선택)가 에피소드를
# 하나라도 뺀 실행에서는 지우지 않고 요약의 delete_skipped 에 사유를 남긴다.
# 에피소드 단위로 지우려면 이 옵션 대신 `./scripts/rosbag.sh delete --exported`.
delete_splits_after_import: false
